[project]
name = "maxv"
version = "0.1.0"
description = "Agentic Media Asset Explorer - Local-first media browser with AI-powered exploration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pymongo>=4.10.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pillow>=11.0.0",
    "numpy>=2.0.0",
    "OpenEXR>=3.3.0",
    "python-multipart>=0.0.12",
    "aiofiles>=24.1.0",
    "send2trash>=1.8.3",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

# Script
[project.scripts]
maxv = "maxv.command:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "src/maxv"]
